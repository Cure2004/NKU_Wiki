# 工作流名称
name: Deploy VitePress site to Pages

# 触发条件：推送到 main 分支时触发
on:
  push:
    branches: [main]
  # 支持手动触发
  workflow_dispatch:

# 权限设置（部署到 Pages 所需）
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一时间只运行一个部署任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 安装 pnpm（版本与你本地一致 11.25.0）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      # 安装 Node.js（版本与你本地一致 24.20.0）
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm

      # 缓存 VitePress 构建文件
      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      # 配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 安装依赖（使用 pnpm）
      - name: Install dependencies
        run: pnpm install

      # 构建 VitePress 站点
      - name: Build with VitePress
        run: pnpm run docs:build

      # 上传构建产物到 Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
